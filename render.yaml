services:
  - type: web
    name: salemo-resolve-tudo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_METHODS
        value: M-Pesa,e-Mola,Transferência bancária
      - key: PAYMENT_NUMBER
        sync: false
      - key: PAYMENT_HOLDER
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        value: Faça o pagamento e envie a referência. A confirmação é manual.
